# ch1 and ch2 form a two-node ClickHouse cluster (`test_cluster`, see
# dev/clickhouse/config/cluster.xml — one shard, two replicas) so
# `--cluster test_cluster` is actually testable locally, for both `analyze`
# and `census`. ch1 is the "primary" node: `--host localhost` with the
# default port always hits it, so every non-cluster example in the README
# (`analyze --database demo`, `census` without `--cluster`) keeps working
# unchanged against it alone.
#
# Both nodes get the same seed (01-04: analyze's demo/analytics fixture,
# then census's databases/materialized-views/empty-tables fixtures). ch2
# additionally gets 05_census_extra_only_on_ch2.sql, which deliberately
# creates a table ch1 doesn't have — a visible, reproducible replica
# desync for `census --cluster test_cluster` to detect.
#
# `keeper` backs distributed DDL (dev/clickhouse/config/zookeeper.xml points
# both nodes at it): `census`'s cluster-wide reads are plain SELECTs and
# don't need it, but `analyze --cluster` also issues `SYSTEM FLUSH LOGS ON
# CLUSTER`, which is DDL and fails with NO_ELEMENTS_IN_CONFIG without a
# ZooKeeper/Keeper configured.

x-ch-node: &ch-node
  image: clickhouse/clickhouse-server:latest
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  depends_on:
    - keeper

services:
  keeper:
    image: clickhouse/clickhouse-keeper:latest
    hostname: keeper
    ports:
      - "9181:9181"
    volumes:
      - ./dev/clickhouse/config/keeper-listen.xml:/etc/clickhouse-keeper/keeper_config.d/listen.xml

  ch1:
    <<: *ch-node
    hostname: ch1
    environment:
      CLICKHOUSE_DB: demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./dev/clickhouse/init/01_analyze_seed.sql:/docker-entrypoint-initdb.d/01_analyze_seed.sql
      - ./dev/clickhouse/init/02_census_databases.sql:/docker-entrypoint-initdb.d/02_census_databases.sql
      - ./dev/clickhouse/init/03_census_landing_and_materialized_views.sql:/docker-entrypoint-initdb.d/03_census_landing_and_materialized_views.sql
      - ./dev/clickhouse/init/04_census_empty_tables.sql:/docker-entrypoint-initdb.d/04_census_empty_tables.sql
      - ./dev/clickhouse/config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./dev/clickhouse/config/zookeeper.xml:/etc/clickhouse-server/config.d/zookeeper.xml
      - ./dev/clickhouse/config/query_views_log.xml:/etc/clickhouse-server/config.d/query_views_log.xml
      - ./dev/clickhouse/config/users.xml:/etc/clickhouse-server/users.d/users.xml

  ch2:
    <<: *ch-node
    hostname: ch2
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - ./dev/clickhouse/init/01_analyze_seed.sql:/docker-entrypoint-initdb.d/01_analyze_seed.sql
      - ./dev/clickhouse/init/02_census_databases.sql:/docker-entrypoint-initdb.d/02_census_databases.sql
      - ./dev/clickhouse/init/03_census_landing_and_materialized_views.sql:/docker-entrypoint-initdb.d/03_census_landing_and_materialized_views.sql
      - ./dev/clickhouse/init/04_census_empty_tables.sql:/docker-entrypoint-initdb.d/04_census_empty_tables.sql
      - ./dev/clickhouse/init/05_census_extra_only_on_ch2.sql:/docker-entrypoint-initdb.d/05_census_extra_only_on_ch2.sql
      - ./dev/clickhouse/config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./dev/clickhouse/config/zookeeper.xml:/etc/clickhouse-server/config.d/zookeeper.xml
      - ./dev/clickhouse/config/query_views_log.xml:/etc/clickhouse-server/config.d/query_views_log.xml
      - ./dev/clickhouse/config/users.xml:/etc/clickhouse-server/users.d/users.xml
