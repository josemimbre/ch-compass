services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./dev/clickhouse/init:/docker-entrypoint-initdb.d
      - ./dev/clickhouse/config/query_views_log.xml:/etc/clickhouse-server/config.d/query_views_log.xml
      - ./dev/clickhouse/config/users.xml:/etc/clickhouse-server/users.d/users.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
